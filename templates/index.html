<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWS Security Monitor</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Monaco,monospace;background:linear-gradient(135deg,#0a0e27,#1a1f3a);color:#00ff88;min-height:100vh}header{background:rgba(0,0,0,.6);border-bottom:2px solid #ff9900;padding:15px 20px}header h1{color:#ff9900}main{max-width:1400px;margin:0 auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:30px}.stat{background:rgba(15,23,42,.9);border:1px solid #ff9900;padding:20px;border-radius:5px}.stat-value{font-size:2em;color:#ff9900;font-weight:bold}.stat-label{color:#00ff88;opacity:.7;margin-top:10px}.panel{background:rgba(15,23,42,.9);border:1px solid #00ff88;padding:20px;margin-bottom:20px;border-radius:5px}.button{padding:12px;background:#ff9900;color:#0a0e27;border:none;border-radius:3px;font-weight:bold;cursor:pointer;margin-bottom:10px}.finding{background:rgba(255,153,0,.1);border-left:3px solid #ff9900;padding:15px;margin-bottom:10px;border-radius:3px}table{width:100%;border-collapse:collapse}th{background:rgba(0,30,60,.8);color:#ff9900;padding:10px;text-align:left}td{padding:10px;border-bottom:1px solid rgba(0,255,68,.1)}</style></head><body><header><h1>☁️ AWS SECURITY MONITOR</h1><p style="color:#00ff88;margin-top:5px">CloudTrail, IAM, and Threat Detection</p></header><main><div class="grid"><div class="stat"><div class="stat-value" id="totalEvents">0</div><div class="stat-label">Events Analyzed</div></div><div class="stat"><div class="stat-value" id="totalFindings">0</div><div class="stat-label">Security Findings</div></div><div class="stat"><div class="stat-value" id="criticalFindings">0</div><div class="stat-label">Critical Issues</div></div><div class="stat"><div class="stat-value" id="complianceScore">-</div><div class="stat-label">Compliance Score</div></div></div><button class="button" onclick="loadDemo()">LOAD SAMPLE EVENTS</button><div class="panel"><h2>Recent Findings</h2><div id="findingsList"></div></div></main><script>const API='http://127.0.0.1:5008';function loadDemo(){fetch(API+'/api/demo/load-events',{method:'POST'}).then(r=>r.json()).then(data=>{updateDashboard()}).catch(e=>console.error(e))}function updateDashboard(){fetch(API+'/api/report').then(r=>r.json()).then(data=>{document.getElementById('totalEvents').textContent=data.total_events;document.getElementById('totalFindings').textContent=data.total_findings;document.getElementById('criticalFindings').textContent=data.risk_distribution.CRITICAL||0});fetch(API+'/api/compliance').then(r=>r.json()).then(data=>{document.getElementById('complianceScore').textContent=data.compliance_score});fetch(API+'/api/findings?limit=10').then(r=>r.json()).then(data=>{let html='';data.findings.forEach(f=>{html+=`<div class="finding"><strong>${f.finding_type}</strong> (${f.risk_level})<br>${f.description}<br><em>${f.remediation}</em></div>`});document.getElementById('findingsList').innerHTML=html||'<p>No findings</p>'}).catch(e=>console.error(e))}setInterval(updateDashboard,30000);</script></body></html>
